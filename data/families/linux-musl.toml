family       = "linux-musl"
provider     = "musl"
arches       = ["x86_64", "i686", "aarch64", "armv7", "armv6", "riscv64", "riscv32"]
clang_triple = "{arch}-unknown-linux-musl"       # quirks may rewrite (armv7 -> musleabihf)
inputs       = ["musl", "linux-uapi"]
runtimes     = ["builtins", "crt", "unwind", "cxxabi", "cxx"]
cxx_abi      = "libcxxabi"
sysname      = "Linux"
os_dir       = "linux"
static_only  = true
resource_layout = "compiler-rt/lib/{clang_triple}"          # where builtins + crtbegin/end land
builtins_name   = "libclang_rt.builtins.a"

[toml]
include_dirs = ["include/c++/v1", "include"]
lib_dirs     = ["lib"]
has_libcxx   = true
static       = true
crt_startup  = ["crt1.o", "crti.o"]
crt_end      = ["crtn.o"]
libc_link    = ["-lc"]
libcxx_link  = ["-lc++", "-lc++abi", "-lunwind"]
rtlib        = "compiler-rt"
unwindlib    = "libunwind"
linker       = "lld"
resource_dir = "compiler-rt"
cc_isolation = ["-nostdlibinc", "-nostdinc++"]

[validate]
run = "native-or-qemu"
