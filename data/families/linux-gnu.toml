family       = "linux-gnu"
provider     = "glibc"
arches       = ["x86_64", "i686", "aarch64", "armv7", "riscv64"]
clang_triple = "{arch}-unknown-linux-gnu"        # armv7 -> armv7-unknown-linux-gnueabihf via quirk
name_suffix  = "-glibc{libc_version}"
inputs       = ["glibc/{libc_version}", "linux-uapi"]
runtimes     = ["builtins", "crt", "unwind", "cxxabi", "cxx"]
runtimes_libc_version = "floor"                  # built once per arch against the floor stubs
cxx_abi      = "libcxxabi"
sysname      = "Linux"
os_dir       = "linux"
static_only  = true
resource_layout = "compiler-rt/lib/{clang_triple}"
builtins_name   = "libclang_rt.builtins.a"

[toml]
include_dirs = ["include/c++/v1", "include"]
lib_dirs     = ["lib"]
has_libcxx   = true
static       = false
crt_startup  = ["crt1.o", "crti.o"]
crt_end      = ["crtn.o"]
libc_link    = ["-lm", "-lpthread", "-ldl", "-lc"]
libcxx_link  = ["-lc++", "-lc++abi", "-lunwind"]
rtlib        = "compiler-rt"
unwindlib    = "libunwind"
linker       = "lld"
resource_dir = "compiler-rt"
cc_isolation = ["-nostdlibinc", "-nostdinc++"]

[validate]
run = "native-or-qemu-with-root"
